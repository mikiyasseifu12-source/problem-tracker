<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Problem Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        input {
            padding: 8px;
            width: 70%;
            margin-right: 10px;
        }
        button {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: white;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Problem Tracker</h1>
    <input type="text" id="problemInput" placeholder="Enter a problem...">
    <button onclick="addProblem()">Add</button>
    <ul id="problemList"></ul>

    <script>
        const API = 'https://problem-tracker-vkli.onrender.com';

        async function loadProblems() {
            const res = await fetch(`${API}/problems`);
            const data = await res.json();
            const list = document.getElementById('problemList');
            list.innerHTML = '';
            data.problems.forEach(p => {
                list.innerHTML += `<li>${p.title} — ${p.solved ? '✅' : '❌'}</li>`;
            });
        }

        async function addProblem() {
            const title = document.getElementById('problemInput').value;
            await fetch(`${API}/problems`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title, solved: false})
            });
            document.getElementById('problemInput').value = '';
            loadProblems();
        }

        loadProblems();
    </script>
</body>
</html>
